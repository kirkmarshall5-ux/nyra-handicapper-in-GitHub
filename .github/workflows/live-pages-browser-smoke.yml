name: Live Pages browser smoke
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  live-browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wait for matching GitHub Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 40); do
            result=$(curl --fail --silent --show-error --retry 3 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs?head_sha=$GITHUB_SHA&per_page=30")
            status=$(echo "$result" | jq -r '[.workflow_runs[] | select(.name=="pages build and deployment")][0].status // "pending"')
            conclusion=$(echo "$result" | jq -r '[.workflow_runs[] | select(.name=="pages build and deployment")][0].conclusion // "pending"')
            echo "Pages deployment for $GITHUB_SHA: $status / $conclusion"
            if [ "$status" = "completed" ]; then
              [ "$conclusion" = "success" ] && exit 0
              exit 1
            fi
            sleep 10
          done
          echo "Timed out waiting for GitHub Pages deployment"
          exit 1
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test runner
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify published Pages URL responds
        run: |
          curl --fail --location --retry 5 --retry-delay 5 --max-time 30 --output /tmp/live-nyra-index.html https://kirkmarshall5-ux.github.io/nyra-handicapper-in-GitHub/
          grep -q 'id="topContenders"' /tmp/live-nyra-index.html
          grep -q 'id="finisherCandidates"' /tmp/live-nyra-index.html
          grep -q 'id="contenderCandidates"' /tmp/live-nyra-index.html
          if grep -Eq 'data-tab="bets"|id="mix1Candidates"|id="v44PaceCandidates"|id="raceSelector"|id="updateOddsSnapshot"' /tmp/live-nyra-index.html; then
            echo "Retired model or betting control found on the live page"
            exit 1
          fi
      - name: Exercise live published site in desktop and iPad-size Chromium
        env:
          QA_URL: https://kirkmarshall5-ux.github.io/nyra-handicapper-in-GitHub/
        run: node scripts/browser-qa.mjs
      - name: Upload live QA report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-pages-browser-qa-${{ github.run_id }}
          path: browser-qa-artifacts/
          if-no-files-found: warn
