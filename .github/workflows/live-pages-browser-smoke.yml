name: Live Pages browser smoke
on:
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
  workflow_dispatch:
jobs:
  live-browser-smoke:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test runner
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify published Pages URL responds
        run: |
          curl --fail --location --retry 5 --retry-delay 5 --max-time 30 --output /tmp/live-nyra-index.html https://kirkmarshall5-ux.github.io/nyra-handicapper-in-GitHub/
          grep -q 'Freeze All 3 Models' /tmp/live-nyra-index.html
      - name: Exercise live published site in desktop and iPad-size Chromium
        env:
          QA_URL: https://kirkmarshall5-ux.github.io/nyra-handicapper-in-GitHub/
        run: node scripts/browser-qa.mjs
      - name: Upload live QA report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-pages-browser-qa-${{ github.run_id }}
          path: browser-qa-artifacts/
          if-no-files-found: warn
